version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: shopnow_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: shopnow

  redis:
    image: redis:7-alpine
    container_name: shopnow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: shopnow_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/shopnow
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    container_name: shopnow_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
  uploads_data:
